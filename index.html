<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>또리 캡모자 쌓기!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @font-face {
      font-family: 'DungGeunMo';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --pixel-bg: #181824;
      --pixel-panel: #fffdf7;
      --pixel-border: #23222b;
      --pixel-accent: #f44755;
      --pixel-gold: #ffca3a;
      --pixel-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #181824;
      background-image:
        radial-gradient(#2c2c40 2px, transparent 2px),
        radial-gradient(#2c2c40 2px, #181824 2px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      font-family: 'DungGeunMo', 'Press Start 2P', monospace;
      color: var(--pixel-border);
      overflow: hidden;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .pixel-box {
      background-color: var(--pixel-panel);
      border: 4px solid var(--pixel-border);
      box-shadow:
        inset -4px -4px 0px #dedad0,
        inset 4px 4px 0px #ffffff,
        0 6px 0px rgba(0, 0, 0, 0.35);
      image-rendering: pixelated;
    }

    .pixel-btn {
      font-family: 'DungGeunMo', 'Press Start 2P', monospace;
      border: 4px solid var(--pixel-border);
      cursor: pointer;
      transition: transform 0.06s steps(2);
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      touch-action: manipulation;
      text-decoration: none;
    }

    .pixel-btn:active {
      transform: translateY(4px);
      box-shadow: none !important;
    }

    .pixel-btn-red {
      background-color: #f44755;
      color: #ffffff;
      box-shadow: inset -4px -4px 0px #b82532, inset 4px 4px 0px #ff7b86, 0 4px 0px var(--pixel-border);
    }

    .pixel-btn-gold {
      background-color: #ffca3a;
      color: #23222b;
      box-shadow: inset -4px -4px 0px #d49b17, inset 4px 4px 0px #ffe699, 0 4px 0px var(--pixel-border);
    }

    .pixel-btn-blue {
      background-color: #4cc9f0;
      color: #14141f;
      box-shadow: inset -4px -4px 0px #2b93b5, inset 4px 4px 0px #90e0ef, 0 4px 0px var(--pixel-border);
    }

    .pixel-btn-green {
      background-color: #34d399;
      color: #14141f;
      box-shadow: inset -4px -4px 0px #059669, inset 4px 4px 0px #a7f3d0, 0 4px 0px var(--pixel-border);
    }

    .pixel-btn-dark {
      background-color: #23222b;
      color: #ffffff;
      box-shadow: inset -4px -4px 0px #0f0e14, inset 4px 4px 0px #454354, 0 4px 0px #000000;
    }

    #game-wrapper {
      width: 100%;
      max-width: 520px;
      height: 100dvh;
      max-height: 860px;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 8px;
    }

    #canvas-container {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
      border: 4px solid var(--pixel-border);
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.45);
      background: #8ecae6;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    @keyframes pixelBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .animate-pixel-bounce {
      animation: pixelBounce 0.9s steps(2) infinite;
    }
  </style>
</head>
<body>

      <div class="flex flex-col">
        <span class="text-[11px] text-gray-500 leading-tight">SCORE</span>

          🔊

      </div>

    <main id="canvas-container">
      <canvas id="gameCanvas"></canvas>

      <div id="start-overlay" class="absolute inset-0 bg-[#181824]/80 flex flex-col items-center justify-center p-4 z-30">
        <div class="pixel-box p-4 sm:p-6 max-w-[360px] w-full flex flex-col items-center text-center gap-3 sm:gap-4">
          <div class="bg-[#23222b] text-[#ffca3a] px-3 py-1 text-xs tracking-widest">
            PIXEL ARCADE
          </div>
          <h1 class="text-2xl sm:text-3xl font-bold text-[#23222b] leading-snug">
            또리 <br/>
            <span class="text-[#f44755]">캡모자 쌓기!</span>

          <div class="bg-[#e8f4f8] border-4 border-[#23222b] p-2 flex items-center justify-center">

          <div class="text-xs sm:text-sm text-gray-700 space-y-1.5 bg-[#f4f1ea] border-2 border-[#23222b] p-3 w-full text-left">

            <p>👑 <b>황금 모자</b>는 보너스 점수 + 균형 복구, <b>돌풍 모자</b> 주의!</p>
            <p>🎤 반짝이는 <b>마이크</b>를 잡으면 보너스 <span class="text-[#f44755] font-bold">^ ^ ♪</span></p>

      <div id="gameover-overlay" class="hidden absolute inset-0 bg-[#181824]/85 flex flex-col items-center justify-center p-4 z-30">

          <div class="w-full grid grid-cols-2 gap-2 pt-1">

              📷 점수 저장

            <a id="btn-share-x" href="https://x.com/intent/tweet" target="_blank" rel="noopener noreferrer" class="pixel-btn pixel-btn-dark w-full py-2.5 text-xs font-bold gap-1">
              <span>𝕏</span>
              <span>X 공유</span>

    <footer class="grid grid-cols-2 gap-3 shrink-0">

        RIGHT ▶
      </button>
    </footer>

  <script>
    class PixelSound {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        } catch (err) {}
      }

      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      }

      playTone(freq, type, duration, startTime = 0, vol = 0.14, slideFreq = null) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        try {
          const now = this.ctx.currentTime + startTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, now + duration);
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration);
        } catch (err) {}
      }

      playCapStack(combo = 1, isPerfect = false) {
        const pitchBoost = Math.min(combo * 22, 340);
        if (isPerfect) {
          this.playTone(587.33 + pitchBoost * 0.4, 'square', 0.08, 0, 0.15);
          this.playTone(880.00 + pitchBoost * 0.4, 'triangle', 0.14, 0.06, 0.17);
        } else {
          this.playTone(320 + pitchBoost, 'square', 0.08, 0, 0.13, 520 + pitchBoost);
          this.playTone(480 + pitchBoost, 'triangle', 0.11, 0.05, 0.15, 680 + pitchBoost);
        }
      }

      playGoldCap() {
        const notes = [659.25, 880.00, 1174.66];
        notes.forEach((f, idx) => this.playTone(f, 'square', 0.09, idx * 0.055, 0.14));
      }

      playMilestone() {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((f, idx) => this.playTone(f, 'triangle', 0.11, idx * 0.07, 0.16));
      }

      playMicBonus() {
        const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
        notes.forEach((freq, idx) => this.playTone(freq, 'square', 0.09, idx * 0.065, 0.13));
      }

      playMiss() {
        this.playTone(190, 'sawtooth', 0.18, 0, 0.15, 95);
      }

      playGameOver() {
        const notes = [392.00, 349.23, 329.63, 261.63];
        notes.forEach((freq, idx) => this.playTone(freq, 'square', 0.22, idx * 0.18, 0.15));
      }
    }

    const sfx = new PixelSound();

    const DUCK_PALETTE = {
      '.': null,
      'K': '#26293a',
      'H': '#3f445c',
      'D': '#32364a',
      'L': '#4f5570',
      'W': '#ffffff',
      'S': '#e6e4ee',
      'G': '#c9c5d6',
      'C': '#4a2511',
      'B': '#ffb833',
      'O': '#9a3412',
      'R': '#ef4444',
      'M': '#991b1b',
      'Y': '#fde047',
      'E': '#3b1c0a'
    };

    const DUCK_BASE_GRID = [
      "......KKKKKKKKKKKKKK......",
      ".....KHHHHHHHHHHHHHHK.....",
      "....KHHHHHHHHHHHHHHHHK....",
      "...KHHHHHHHHHHHHHHHHHHK...",
      "..KHHHHHHHHHHHHHHHHHHHHK..",
      "..KHHHHHHHHHHHHHHHHHHHHK..",
      "..KHHHHHHHHHHHHHHHHHHHHK..",
      "..KHHHHHHHHHHHHHHHHHHHHK..",
      "..KHHHHHHHHHHHHHHHHHHHHK..",
      "..KHHHHHHHHHHHHHHHHHHHHK..",
      "..KHHHHHHHHHHHHHHHHHHHHK..",
      "..KHHHHHHHHHHHHHHHHHHHHK..",
      "..KHHHHHHHHHHHHHHHHHHHHK..",
      "..KHHHHHHHHHHHHHHHHHHHHK..",
      "..KHHHHHHHHHHHHHHHHHHHHK..",
      "...CWWWWWWWWWWWWWWWWWWC...",
      "...CWWEEEEWWWWWWEEEEWWC...",
      "...CWEWEEWEWWWWEWEEWEWC...",
      "...CWEEWWEEWWWWEEWWEEWC...",
      "...CWWEEEEWWWWWWEEEEWWC...",
      "...CWWWWWWWWBBWWWWWWCWC...",
      "...CWWWWWWBBBBBBWWCWWWC...",
      "....CWWWBBBBBBBBBBWCWWC...",
      "....CWWWOOOOOOOOOOWWWWC...",
      ".....CWWBBBBBBBBBBWWWC....",
      "....CYYCMMMMMMMMMMCYYC....",
      "..GGGYYCRRRRRRRRRRCYYGGG..",
      ".GWWWWWSRRRRYYRRRRWWWWWWG.",
      "GWWWWWWWRRRRRRRRRRWWWWWWWG",
      "GWWWWWWWRRRRYYRRRRWWWWWWWG",
      ".GWWSSWSRRRRRRRRRRSWSSWWG.",
      "..GGGGG.MRRRYYRRRM.GGGGG..",
      "........MRRRRRRRRM........",
      ".........MMMMMMMM.........",
      ".........OBBO.OBBO........",
      "........OBBBO.OBBBO.......",
      ".........OOO...OOO........"
    ];

    const HAPPY_FACE_PATCH = {
      16: "...CWWWEEWWWWWWWWEEWWWC...",
      17: "...CWWEWWEEWWWWEEWWEWWC...",
      18: "...CEWWWWWWEWWEWWWWWWEWC...",
      19: "...CWWWWWWWWWWWWWWWWWWC..."
    };

    function drawDuckCharacter(ctx, centerX, bottomY, pixelSize, isHappy = false, walkFrame = 0) {
      const rows = DUCK_BASE_GRID.length;
      const cols = DUCK_BASE_GRID[0].length;
      const startX = Math.round(centerX - (cols * pixelSize) / 2);
      const startY = Math.round(bottomY - rows * pixelSize);

      for (let r = 0; r < rows; r++) {
        let rowStr = DUCK_BASE_GRID[r];
        if (isHappy && HAPPY_FACE_PATCH[r]) rowStr = HAPPY_FACE_PATCH[r];

        for (let c = 0; c < cols; c++) {
          const ch = rowStr[c];
          const color = DUCK_PALETTE[ch];
          if (!color) continue;

          let drawY = startY + r * pixelSize;
          if (r >= 34 && walkFrame !== 0) {
            const isLeftFoot = c < cols / 2;
            if ((walkFrame === 1 && isLeftFoot) || (walkFrame === 2 && !isLeftFoot)) {
              drawY -= pixelSize;
            }
          }

          ctx.fillStyle = color;
          ctx.fillRect(startX + c * pixelSize, drawY, pixelSize, pixelSize);
        }
      }
    }

    const CAP_COLORS = [
      { main: '#ef4444', dark: '#b91c1c', visor: '#991b1b', logo: '#ffffff' },
      { main: '#3b82f6', dark: '#1d4ed8', visor: '#1e3a8a', logo: '#fde047' },
      { main: '#10b981', dark: '#047857', visor: '#065f46', logo: '#ffffff' },
      { main: '#f59e0b', dark: '#b45309', visor: '#78350f', logo: '#ffffff' },
      { main: '#8b5cf6', dark: '#6d28d9', visor: '#4c1d95', logo: '#fde047' },
      { main: '#ec4899', dark: '#be185d', visor: '#831843', logo: '#ffffff' },
      { main: '#06b6d4', dark: '#0e7490', visor: '#164e63', logo: '#ffffff' }
    ];

    const GOLD_CAP_COLOR = { main: '#ffca3a', dark: '#d97706', visor: '#b45309', logo: '#ffffff' };

    function drawPixelCap(ctx, centerX, bottomY, pixelSize, colorScheme, dir = 1) {
      const capGridRight = [
        ".....KKKKKKKK.........",
        "...KKMMMMMMMMKK.......",
        "..KMMMMMWWMMMMMK......",
        ".KMMMMMMWWMMMMMMK.....",
        ".KMMMMMMMMMMMMMMKKKK..",
        "KDDDDDDDDDDDDDDVVVVVK.",
        "KKKKKKKKKKKKKKKKKKKKKK"
      ];

      const rows = capGridRight.length;
      const cols = capGridRight[0].length;
      const crownCenterOffset = dir === 1 ? (8 * pixelSize) : ((cols - 8) * pixelSize);
      const startX = Math.round(centerX - crownCenterOffset);
      const startY = Math.round(bottomY - rows * pixelSize);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const srcCol = dir === 1 ? c : (cols - 1 - c);
          const ch = capGridRight[r][srcCol];
          if (ch === '.') continue;

          if (ch === 'K') ctx.fillStyle = '#23222b';
          else if (ch === 'M') ctx.fillStyle = colorScheme.main;
          else if (ch === 'D') ctx.fillStyle = colorScheme.dark;
          else if (ch === 'V') ctx.fillStyle = colorScheme.visor;
          else if (ch === 'W') ctx.fillStyle = colorScheme.logo;

          ctx.fillRect(startX + c * pixelSize, startY + r * pixelSize, pixelSize, pixelSize);
        }
      }
    }

    function drawPixelMic(ctx, centerX, centerY, pixelSize) {
      const micGrid = [
        "...KKKK...",
        "..KGGGGK..",
        ".KGLLLLGK.",
        ".KGLGGLGK.",
        ".KGGGGGGK.",
        "..KKKKKK..",
        "...KDDK...",
        "...KSSK...",
        "...KSSK...",
        "...KDDK...",
        "...KSSK...",
        "....KK...."
      ];
      const rows = micGrid.length;
      const cols = micGrid[0].length;
      const startX = Math.round(centerX - (cols * pixelSize) / 2);
      const startY = Math.round(centerY - (rows * pixelSize) / 2);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const ch = micGrid[r][c];
          if (ch === '.') continue;
          if (ch === 'K') ctx.fillStyle = '#23222b';
          else if (ch === 'G') ctx.fillStyle = '#9ca3af';
          else if (ch === 'L') ctx.fillStyle = '#f3f4f6';
          else if (ch === 'D') ctx.fillStyle = '#374151';
          else if (ch === 'S') ctx.fillStyle = '#60a5fa';

          ctx.fillRect(startX + c * pixelSize, startY + r * pixelSize, pixelSize, pixelSize);
        }
      }
    }
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const previewCanvas = document.getElementById('previewCanvas');
    const previewCtx = previewCanvas.getContext('2d');

    const hudScore = document.getElementById('hud-score');
    const hudCaps = document.getElementById('hud-caps');
    const hudBest = document.getElementById('hud-best');
    const hudHearts = document.getElementById('hud-hearts');
    const btnSound = document.getElementById('btn-sound');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const btnStart = document.getElementById('btn-start');
    const btnRestart = document.getElementById('btn-restart');
    const btnSaveScore = document.getElementById('btn-save-score');
    const btnShareX = document.getElementById('btn-share-x');
    const saveStatus = document.getElementById('save-status');

    const btnRight = document.getElementById('btn-right');

    let bestScore = 0;
    try {
      bestScore = parseInt(localStorage.getItem('duck_cap_best') || '0', 10) || 0;
    } catch (e) {
      bestScore = 0;
    }
    hudBest.textContent = String(bestScore).padStart(5, '0');

    const PIXEL = 4;

    let lives = 3;
    let lastTime = 0;
    let spawnTimer = 0;
    let micSpawnTimer = 0;
    let cameraY = 0;
    let milestoneBanner = { text: '', timer: 0 };
    let shootingStar = { active: false, x: 0, y: 0, vx: 0, vy: 0, timer: 4 };

    const keys = { left: false, right: false };
    let pointerActive = false;
    let pointerTargetX = null;

    const player = {
      x: 240,
      y: 0,
      vx: 0,
      speed: 430,
      dir: 1,
      walkTimer: 0,
      walkFrame: 0,
      happyTimer: 0,
      noteSpawnTimer: 0
    };

    let stackedCaps = [];
    let fallingItems = [];
    let particles = [];
    let floatingEffects = [];

    const clouds = [
      { x: 60, y: 90, scale: 4, speed: 12 },
      { x: 280, y: 160, scale: 3, speed: 8 },
      { x: 180, y: 260, scale: 5, speed: 15 }
    ];

    const birds = [
      { x: 40, y: 130, speed: 34, flap: 0 },
      { x: 260, y: 210, speed: 26, flap: 1.5 }
    ];

    function renderPreviewDuck() {
      if (!previewCtx) return;
      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
      previewCtx.imageSmoothingEnabled = false;
      const duckBottomY = 122;
      const pSize = 3;
      const duckH = DUCK_BASE_GRID.length * pSize;
      const firstCapOverlap = 4 * pSize;
      const capStep = 3 * pSize;
      drawDuckCharacter(previewCtx, 64, duckBottomY, pSize, false, 0);
      drawPixelCap(previewCtx, 64, duckBottomY - duckH + firstCapOverlap, pSize, CAP_COLORS[0], 1);
      drawPixelCap(previewCtx, 64, duckBottomY - duckH + firstCapOverlap - capStep, pSize, GOLD_CAP_COLOR, -1);
    }

    function resizeCanvas() {
      const container = document.getElementById('canvas-container');
      if (!container) return;
      const rect = container.getBoundingClientRect();
      canvas.width = Math.max(200, Math.floor(rect.width));
      canvas.height = Math.max(300, Math.floor(rect.height));
      ctx.imageSmoothingEnabled = false;

      player.y = canvas.height - 28;
      if (player.x > canvas.width - 40) player.x = canvas.width - 40;
      if (player.x < 40) player.x = 40;
    }

    function updateHeartsUI() {
      hudHearts.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const active = i < lives;
        const heart = document.createElement('span');
        heart.className = 'inline-block text-base sm:text-lg leading-none';
        heart.style.color = active ? '#f44755' : '#cbd5e1';
        heart.style.textShadow = active ? '2px 2px 0px #23222b' : 'none';
        heart.textContent = '♥';
        hudHearts.appendChild(heart);
      }
    }

    function updateHUD() {
      hudScore.textContent = String(score).padStart(5, '0');
      hudCaps.textContent = stackedCaps.length;
      if (score > bestScore) {
        bestScore = score;
        try {
          localStorage.setItem('duck_cap_best', String(bestScore));
        } catch (e) {}
      }
      hudBest.textContent = String(bestScore).padStart(5, '0');
    }

    function toggleSoundUI() {
      const isMuted = sfx.toggleMute();
      btnSound.textContent = isMuted ? '🔇' : '🔊';
    }

    function startGame() {
      sfx.init();
      resizeCanvas();

      score = 0;
      combo = 0;
      lives = 3;
      stackedCaps = [];
      fallingItems = [];
      particles = [];
      floatingEffects = [];
      cameraY = 0;
      spawnTimer = 0.35;
      micSpawnTimer = 5.5;
      milestoneBanner = { text: '', timer: 0 };

      keys.left = false;
      keys.right = false;
      pointerActive = false;
      pointerTargetX = null;

      player.x = canvas.width / 2;
      player.y = canvas.height - 28;
      player.vx = 0;
      player.happyTimer = 0;

      if (saveStatus) saveStatus.textContent = '';

      updateHUD();
      updateHeartsUI();

      startOverlay.classList.add('hidden');
      gameoverOverlay.classList.add('hidden');
      gameState = 'PLAYING';
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      sfx.playGameOver();

      document.getElementById('final-score').textContent = score.toLocaleString() + ' PTS';
      document.getElementById('final-caps').textContent = stackedCaps.length + ' 개';
      document.getElementById('final-best').textContent = bestScore.toLocaleString() + ' PTS';

      const pageUrl = window.location.href;
      const shareText = `🧢 또리 캡모자 쌓기에서 캡모자 ${stackedCaps.length}개 쌓고 ${score.toLocaleString()}점 달성!`;
      if (btnShareX) {
        btnShareX.href = `https://x.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(pageUrl)}`;
      }
      if (saveStatus) saveStatus.textContent = '';

      gameoverOverlay.classList.remove('hidden');
    }

    function spawnParticles(x, y, colors, count = 10) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
        const speed = 60 + Math.random() * 140;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 60,
          size: PIXEL * (Math.random() > 0.5 ? 1.5 : 1),
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 0.55 + Math.random() * 0.25
        });
      }
    }

    function spawnFloatingText(x, y, text, color = '#ffca3a', size = 16) {
      floatingEffects.push({
        x,
        y,
        vy: -55,
        text,
        color,
        size,
        life: 1.15
      });
    }

    function spawnCap() {
      const margin = 48;
      const x = margin + Math.random() * Math.max(40, canvas.width - margin * 2);
      const dir = Math.random() > 0.5 ? 1 : -1;
      const roll = Math.random();

      let capKind = 'normal';
      let colorScheme = CAP_COLORS[Math.floor(Math.random() * CAP_COLORS.length)];
      let baseSpeed = 225 + Math.min(stackedCaps.length * 8, 270);
      let swayAmp = 8;

      if (roll < 0.12) {
        capKind = 'gold';
        colorScheme = GOLD_CAP_COLOR;
        baseSpeed += 25;
        swayAmp = 10;
      } else if (roll < 0.28) {
        capKind = 'wind';
        baseSpeed += 40;
        swayAmp = 22;
      }

      fallingItems.push({
        type: 'cap',
        capKind,
        x,
        y: -30 - cameraY,
        vy: baseSpeed + Math.random() * 35,
        colorScheme,
        dir,
        swayAmp,
        phase: Math.random() * Math.PI * 2
      });
    }

    function spawnMic() {
      const margin = 48;
      const x = margin + Math.random() * Math.max(40, canvas.width - margin * 2);
      fallingItems.push({
        type: 'mic',
        x,
        y: -36 - cameraY,
        vy: 245,
        phase: 0
      });
    }

    function update(dt) {
      clouds.forEach(c => {
        c.x += c.speed * dt;
        if (c.x > canvas.width + 80) c.x = -80;
      });

      birds.forEach(b => {
        b.x += b.speed * dt;
        b.flap += dt * 8;
        if (b.x > canvas.width + 40) b.x = -40;
      });

      if (milestoneBanner.timer > 0) {
        milestoneBanner.timer -= dt;
      }

      if (stackedCaps.length >= 15) {
        if (!shootingStar.active) {
          shootingStar.timer -= dt;
          if (shootingStar.timer <= 0) {
            shootingStar.active = true;
            shootingStar.x = Math.random() * (canvas.width * 0.7);
            shootingStar.y = 30 + Math.random() * 100;
            shootingStar.vx = 260;
            shootingStar.vy = 140;
            shootingStar.timer = 5 + Math.random() * 4;
          }
        } else {
          shootingStar.x += shootingStar.vx * dt;
          shootingStar.y += shootingStar.vy * dt;
          if (shootingStar.x > canvas.width + 60 || shootingStar.y > canvas.height) {
            shootingStar.active = false;
          }
        }
      }

      if (gameState !== 'PLAYING') return;

      let moveDir = 0;
      if (keys.left) moveDir -= 1;
      if (keys.right) moveDir += 1;

      if (pointerActive && pointerTargetX !== null) {
        const diff = pointerTargetX - player.x;
        if (Math.abs(diff) > 6) moveDir = diff > 0 ? 1 : -1;
      }

      const prevX = player.x;
      if (moveDir !== 0) {
        player.vx = moveDir * player.speed;
        player.x += player.vx * dt;
        player.dir = moveDir;

        if (pointerActive && pointerTargetX !== null) {
          if ((moveDir === 1 && player.x > pointerTargetX) || (moveDir === -1 && player.x < pointerTargetX)) {
            player.x = pointerTargetX;
          }
        }

        player.walkTimer += dt;
        if (player.walkTimer > 0.09) {
          player.walkTimer = 0;
          player.walkFrame = player.walkFrame === 1 ? 2 : 1;
        }
      } else {
        player.vx = 0;
        player.walkFrame = 0;
      }

      const halfWidth = (26 * PIXEL) / 2;
      player.x = Math.max(halfWidth + 6, Math.min(canvas.width - halfWidth - 6, player.x));
      const actualDeltaX = player.x - prevX;

      if (player.happyTimer > 0) {
        player.happyTimer -= dt;
        player.noteSpawnTimer -= dt;
        if (player.noteSpawnTimer <= 0) {
          player.noteSpawnTimer = 0.28;
          const notes = ['♪', '♫', '♩', '♬'];
          const noteChar = notes[Math.floor(Math.random() * notes.length)];
          const offsetX = (Math.random() - 0.5) * 90;
          spawnFloatingText(
            player.x + offsetX,
            player.y - DUCK_BASE_GRID.length * PIXEL - 10,
            noteChar,
            Math.random() > 0.5 ? '#ffca3a' : '#ff5765',
            22
          );
        }
      }

      for (let i = 0; i < stackedCaps.length; i++) {
        const cap = stackedCaps[i];
        const factor = (i + 1) * 0.022;
        cap.offsetX -= actualDeltaX * Math.min(factor, 0.42);
        const springForce = -cap.offsetX * 1.1;
        cap.wobbleVel = (cap.wobbleVel + springForce * dt) * 0.78;
        cap.offsetX += cap.wobbleVel * dt;
        cap.offsetX = Math.max(-48, Math.min(48, cap.offsetX));
      }

      const capStepHeight = 3 * PIXEL;
      const duckHeight = DUCK_BASE_GRID.length * PIXEL;
      const firstCapOverlap = 4 * PIXEL;
      const stackTopY = player.y - duckHeight + firstCapOverlap - stackedCaps.length * capStepHeight;
      const desiredTopScreenY = canvas.height * 0.44;
      const targetCameraY = Math.max(0, desiredTopScreenY - stackTopY);
      cameraY += (targetCameraY - cameraY) * Math.min(1, dt * 6);

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnCap();
        spawnTimer = Math.max(0.48, 1.12 - stackedCaps.length * 0.022);
      }

      micSpawnTimer -= dt;
      if (micSpawnTimer <= 0) {
        spawnMic();
        micSpawnTimer = 7.5 + Math.random() * 4.5;
      }

      const topCap = stackedCaps.length > 0 ? stackedCaps[stackedCaps.length - 1] : null;
      const catchCenterX = player.x + (topCap ? topCap.offsetX : 0);
      const catchTopY = stackTopY;

      for (let i = fallingItems.length - 1; i >= 0; i--) {
        const item = fallingItems[i];
        item.y += item.vy * dt;
        item.phase += dt * (item.capKind === 'wind' ? 7.5 : 5);

        if (item.type === 'cap') {
          const swayX = Math.sin(item.phase) * item.swayAmp;
          const actualCapX = item.x + swayX;
          const dx = Math.abs(actualCapX - catchCenterX);
          const dy = Math.abs(item.y - catchTopY);

          if (dx < 38 && dy < 20) {
            const isPerfect = dx <= 11;
            const isGold = item.capKind === 'gold';

            combo += 1;
            let gained = 100 + (combo - 1) * 20;
            if (isPerfect) gained += 150;
            if (isGold) gained += 300;
            score += gained;

            if (isGold) {
              sfx.playGoldCap();
              stackedCaps.forEach(c => {
                c.offsetX *= 0.35;
                c.wobbleVel = 0;
              });
            } else {
              sfx.playCapStack(combo, isPerfect);
              if (isPerfect) {
                stackedCaps.forEach(c => {
                  c.offsetX *= 0.7;
                  c.wobbleVel *= 0.5;
                });
              }
            }

            stackedCaps.push({
              colorScheme: item.colorScheme,
              dir: item.dir,
              offsetX: isPerfect ? 0 : (actualCapX - catchCenterX) * 0.55,
              wobbleVel: 0
            });

            const newCount = stackedCaps.length;
            if (newCount > 0 && newCount % 10 === 0) {
              sfx.playMilestone();
              milestoneBanner = { text: `★ ${newCount}층 돌파! ★`, timer: 2.2 };
              spawnParticles(catchCenterX, catchTopY - 20, ['#ffca3a', '#f44755', '#34d399', '#60a5fa'], 20);
            }

            const pColors = isGold
              ? ['#ffca3a', '#ffffff', '#f59e0b']
              : (isPerfect ? ['#ffca3a', '#34d399', '#ffffff'] : [item.colorScheme.main, '#ffffff']);
            spawnParticles(actualCapX, catchTopY, pColors, isPerfect || isGold ? 14 : 8);

            let label = `+${gained}`;
            let labelColor = '#ffffff';
            if (isGold) {
              label = `GOLD! +${gained}`;
              labelColor = '#ffca3a';
            } else if (isPerfect) {
              label = `PERFECT! +${gained}`;
              labelColor = '#34d399';
            } else if (combo > 1) {
              label = `+${gained} (${combo}COMBO)`;
            }
            spawnFloatingText(actualCapX, catchTopY - 16, label, labelColor, isPerfect || isGold ? 17 : 15);

            updateHUD();
            fallingItems.splice(i, 1);
            continue;
          }

          if (item.y > player.y + 30) {
            combo = 0;
            lives -= 1;
            sfx.playMiss();
            updateHeartsUI();
            spawnParticles(actualCapX, player.y, ['#f44755', '#23222b'], 10);
            spawnFloatingText(actualCapX, player.y - 20, 'MISS!', '#f44755', 16);
            fallingItems.splice(i, 1);

            if (lives <= 0) {
              triggerGameOver();
              return;
            }
          }
        } else if (item.type === 'mic') {
          const withinX = Math.abs(item.x - player.x) < 54;
          const withinY = item.y >= catchTopY - 15 && item.y <= player.y;

          if (withinX && withinY) {
            const bonus = 500;
            score += bonus;
            sfx.playMicBonus();

            player.happyTimer = 2.5;
            player.noteSpawnTimer = 0;

            spawnParticles(item.x, item.y, ['#ffca3a', '#60a5fa', '#ff5765', '#ffffff'], 16);
            spawnFloatingText(player.x, player.y - duckHeight - 28, `BONUS +${bonus}! ♪`, '#ffca3a', 18);

            updateHUD();
            fallingItems.splice(i, 1);
            continue;
          }

          if (item.y > player.y + 40) fallingItems.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 320 * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = floatingEffects.length - 1; i >= 0; i--) {
        const f = floatingEffects[i];
        f.y += f.vy * dt;
        f.life -= dt;
        if (f.life <= 0) floatingEffects.splice(i, 1);
      }
    }

    function drawPixelCloud(x, y, s) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x, y, s * 10, s * 3);
      ctx.fillRect(x + s * 2, y - s * 2, s * 6, s * 2);
      ctx.fillRect(x + s * 3, y - s * 3, s * 3, s);
      ctx.fillStyle = '#dbeafe';
      ctx.fillRect(x, y + s * 2, s * 10, s);
    }

    function drawPixelBird(x, y, flap) {
      const wingY = Math.sin(flap) > 0 ? -3 : 3;
      ctx.fillStyle = '#23222b';
      ctx.fillRect(x, y, 8, 4);
      ctx.fillRect(x - 6, y + wingY, 6, 3);
      ctx.fillRect(x + 8, y + wingY, 6, 3);
    }

    function render() {
      const w = canvas.width;
      const h = canvas.height;

      const heightProgress = Math.min(stackedCaps.length / 35, 1);
      if (heightProgress < 0.45) ctx.fillStyle = '#8ecae6';
      else if (heightProgress < 0.8) ctx.fillStyle = '#5e81ac';
      else ctx.fillStyle = '#1e2235';
      ctx.fillRect(0, 0, w, h);

      if (stackedCaps.length >= 20) {
        const moonX = w - 64;
        const moonY = 58;
        ctx.fillStyle = '#ffca3a';
        ctx.fillRect(moonX, moonY, 20, 24);
        ctx.fillStyle = heightProgress < 0.8 ? '#5e81ac' : '#1e2235';
        ctx.fillRect(moonX + 8, moonY - 2, 16, 20);
      }

      if (stackedCaps.length >= 10) {
        ctx.fillStyle = '#fff3b0';
        for (let s = 0; s < 16; s++) {
          const sx = (s * 73) % w;
          const sy = ((s * 97 + cameraY * 0.2) % (h - 80));
          ctx.fillRect(sx, sy, 4, 4);
        }
      }

      if (shootingStar.active) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.round(shootingStar.x), Math.round(shootingStar.y), 6, 6);
        ctx.fillStyle = '#ffca3a';
        ctx.fillRect(Math.round(shootingStar.x - 10), Math.round(shootingStar.y - 5), 8, 4);
        ctx.fillRect(Math.round(shootingStar.x - 18), Math.round(shootingStar.y - 9), 6, 3);
      }

      clouds.forEach(c => {
        const drawY = ((c.y + cameraY * 0.35) % (h + 60));
        drawPixelCloud(Math.round(c.x), Math.round(drawY), c.scale);
      });

      if (stackedCaps.length < 18) {
        birds.forEach(b => {
          const by = ((b.y + cameraY * 0.45) % (h - 100));
          drawPixelBird(Math.round(b.x), Math.round(by), b.flap);
        });
      }

      ctx.save();
      ctx.translate(0, Math.round(cameraY));

      const floorTop = player.y - 2;
      ctx.fillStyle = '#23222b';
      ctx.fillRect(0, floorTop, w, 4);
      ctx.fillStyle = '#52b788';
      ctx.fillRect(0, floorTop + 4, w, 10);
      ctx.fillStyle = '#40916c';
      for (let gx = 0; gx < w; gx += 16) ctx.fillRect(gx, floorTop + 10, 8, 4);
      ctx.fillStyle = '#bc6c25';
      ctx.fillRect(0, floorTop + 14, w, 30);
      ctx.fillStyle = '#dda15e';
      for (let bx = 0; bx < w; bx += 24) ctx.fillRect(bx + 2, floorTop + 16, 18, 8);

      const isHappy = player.happyTimer > 0;
      drawDuckCharacter(ctx, player.x, player.y, PIXEL, isHappy, player.walkFrame);

      const duckHeight = DUCK_BASE_GRID.length * PIXEL;
      const capStepHeight = 3 * PIXEL;
      const firstCapOverlap = 4 * PIXEL;
      let currentStackY = player.y - duckHeight + firstCapOverlap;

      for (let i = 0; i < stackedCaps.length; i++) {
        const cap = stackedCaps[i];
        const capX = player.x + cap.offsetX;
        drawPixelCap(ctx, capX, currentStackY, PIXEL, cap.colorScheme, cap.dir);
        currentStackY -= capStepHeight;
      }

      fallingItems.forEach(item => {
        if (item.type === 'cap') {
          const swayX = Math.sin(item.phase) * item.swayAmp;
          const drawX = item.x + swayX;

          if (item.capKind === 'gold') {
            const sparkle = Math.sin(item.phase * 3) > 0;
            ctx.fillStyle = sparkle ? '#ffffff' : '#ffca3a';
            ctx.fillRect(drawX - 22, item.y - 24, 4, 4);
            ctx.fillRect(drawX + 20, item.y - 12, 4, 4);
          } else if (item.capKind === 'wind') {
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.fillRect(drawX - 28, item.y - 14, 10, 3);
            ctx.fillRect(drawX + 18, item.y - 8, 10, 3);
          }

          drawPixelCap(ctx, drawX, item.y, PIXEL, item.colorScheme, item.dir);
        } else if (item.type === 'mic') {
          const pulse = Math.sin(item.phase * 2) > 0;
          ctx.fillStyle = pulse ? '#ffca3a' : '#ffffff';
          ctx.fillRect(item.x - 24, item.y - 12, 4, 4);
          ctx.fillRect(item.x + 20, item.y + 8, 4, 4);
          if (pulse) {
            ctx.fillRect(item.x + 18, item.y - 18, 4, 4);
            ctx.fillRect(item.x - 20, item.y + 14, 4, 4);
          }
          drawPixelMic(ctx, item.x, item.y, PIXEL);
        }
      });

      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.round(p.x), Math.round(p.y), Math.round(p.size), Math.round(p.size));
      });

      floatingEffects.forEach(f => {
        ctx.font = `bold ${f.size}px "DungGeunMo", "Press Start 2P", monospace`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#23222b';
        ctx.fillText(f.text, Math.round(f.x) + 2, Math.round(f.y) + 2);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, Math.round(f.x), Math.round(f.y));
      });

      ctx.restore();

      if (gameState === 'PLAYING' && combo >= 2) {
        const isFever = combo >= 5;
        ctx.font = `bold ${isFever ? 17 : 14}px "DungGeunMo", "Press Start 2P", monospace`;
        ctx.textAlign = 'left';
        ctx.fillStyle = '#23222b';
        ctx.fillText(isFever ? `🔥 ${combo} FEVER!` : `${combo} COMBO!`, 14, 28);
        ctx.fillStyle = isFever ? '#f44755' : '#ffca3a';
        ctx.fillText(isFever ? `🔥 ${combo} FEVER!` : `${combo} COMBO!`, 12, 26);
      }

      if (milestoneBanner.timer > 0) {
        ctx.font = 'bold 20px "DungGeunMo", "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#23222b';
        ctx.fillText(milestoneBanner.text, Math.round(w / 2) + 2, 66);
        ctx.fillStyle = '#ffca3a';
        ctx.fillText(milestoneBanner.text, Math.round(w / 2), 64);
      }
    }

    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      update(dt);
      render();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('resize', resizeCanvas);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keys.left = true;
        pointerActive = false;
      }
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keys.right = true;
        pointerActive = false;
      }
      if ((e.key === ' ' || e.key === 'Enter') && gameState !== 'PLAYING') startGame();
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    });

    function updatePointerPosition(clientX) {
      const rect = canvas.getBoundingClientRect();
      pointerTargetX = clientX - rect.left;
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (gameState !== 'PLAYING') return;
      pointerActive = true;
      updatePointerPosition(e.clientX);
    });

    canvas.addEventListener('touchstart', (e) => {
      if (gameState !== 'PLAYING') return;
      if (e.touches && e.touches.length > 0) {
        pointerActive = true;
        updatePointerPosition(e.touches[0].clientX);
      }
    }, { passive: true });

    window.addEventListener('pointermove', (e) => {
      if (pointerActive && gameState === 'PLAYING') updatePointerPosition(e.clientX);
    });

    window.addEventListener('touchmove', (e) => {
      if (pointerActive && gameState === 'PLAYING' && e.touches && e.touches.length > 0) {
        updatePointerPosition(e.touches[0].clientX);
      }
    }, { passive: true });

    window.addEventListener('pointerup', () => { pointerActive = false; });
    window.addEventListener('touchend', () => { pointerActive = false; });

    function bindHoldButton(btn, dirKey) {
      const press = (e) => {
        if (e.cancelable) e.preventDefault();
        keys[dirKey] = true;
        pointerActive = false;
      };
      const release = (e) => {
        if (e.cancelable) e.preventDefault();
        keys[dirKey] = false;
      };
      btn.addEventListener('pointerdown', press);
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointerleave', release);
      btn.addEventListener('pointercancel', release);
      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('touchcancel', release, { passive: false });
    }
    bindHoldButton(btnLeft, 'left');
    bindHoldButton(btnRight, 'right');

    btnSound.addEventListener('click', toggleSoundUI);
    btnStart.addEventListener('click', startGame);
    btnRestart.addEventListener('click', startGame);

    btnStart.addEventListener('touchend', (e) => {
      e.preventDefault();
      startGame();
    }, { passive: false });

    btnRestart.addEventListener('touchend', (e) => {
      e.preventDefault();
      startGame();
    }, { passive: false });

    if (btnSaveScore) {
      btnSaveScore.addEventListener('click', () => {
        const card = document.createElement('canvas');
        card.width = 600;
        card.height = 340;
        const cctx = card.getContext('2d');
        cctx.imageSmoothingEnabled = false;

        cctx.fillStyle = '#181824';
        cctx.fillRect(0, 0, 600, 340);
        cctx.fillStyle = '#fffdf7';
        cctx.fillRect(24, 24, 552, 292);
        cctx.strokeStyle = '#23222b';
        cctx.lineWidth = 6;
        cctx.strokeRect(24, 24, 552, 292);

        cctx.fillStyle = '#f44755';
        cctx.font = 'bold 28px "DungGeunMo", monospace';
        cctx.fillText('또리 캡모자 쌓기! SCORE', 52, 78);

        cctx.fillStyle = '#23222b';
        cctx.font = 'bold 24px "DungGeunMo", monospace';
        cctx.fillText(`최종 점수 : ${score.toLocaleString()} PTS`, 52, 138);
        cctx.fillStyle = '#3b82f6';
        cctx.fillText(`쌓은 모자 : ${stackedCaps.length} 개`, 52, 184);
        cctx.fillStyle = '#d49b17';
        cctx.fillText(`최고 기록 : ${bestScore.toLocaleString()} PTS`, 52, 230);

        cctx.fillStyle = '#6b7280';
        cctx.font = '15px "DungGeunMo", monospace';
        cctx.fillText(window.location.href, 52, 286);

        const pSize = 4;
        drawDuckCharacter(cctx, 475, 285, pSize, false, 0);
        const duckH = DUCK_BASE_GRID.length * pSize;
        const capCount = Math.min(stackedCaps.length, 6);
        for (let i = 0; i < capCount; i++) {
          const capY = 285 - duckH + (4 * pSize) - (i * 3 * pSize);
          drawPixelCap(cctx, 475, capY, pSize, stackedCaps[i].colorScheme, stackedCaps[i].dir);
        }

        card.toBlob(async (blob) => {
          if (!blob) return;
          const file = new File([blob], 'ddory_cap_score.png', { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({ files: [file], title: '또리 캡모자 쌓기!' });
              if (saveStatus) saveStatus.textContent = '공유 창에서 [이미지 저장]을 눌러주세요!';
              return;
            } catch (err) {}
          }
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'ddory_cap_score.png';
          a.click();
          if (saveStatus) saveStatus.textContent = '다운로드를 누른 뒤 사진에 저장하세요!';
        }, 'image/png');
      });
    }

    resizeCanvas();
    updateHeartsUI();
    renderPreviewDuck();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
